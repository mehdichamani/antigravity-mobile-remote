<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Background Glow Orb -->
  <circle cx="256" cy="240" r="140" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Stylized Anti-gravity Rocket / Triangle Core -->
  <g transform="translate(256, 250)">
    <!-- Outer Orbit Ring -->
    <ellipse rx="150" ry="60" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-dasharray="12 16" transform="rotate(-25)" opacity="0.75" />

    <!-- Center Antigravity Core -->
    <path d="M 0 -110 L 80 50 L -80 50 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M 0 -80 L 50 35 L -50 35 Z" fill="url(#primaryGrad)" opacity="0.3" stroke-linejoin="round" />

    <!-- Signal waves for Mobile Remote -->
    <path d="M -35 80 C -15 95 15 95 35 80" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <path d="M -60 110 C -25 135 25 135 60 110" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M -85 140 C -35 175 35 175 85 140" fill="none" stroke="#c084fc" stroke-width="8" stroke-linecap="round" opacity="0.5" />

    <!-- Center Energy Core Spark -->
    <circle cx="0" cy="-10" r="14" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
