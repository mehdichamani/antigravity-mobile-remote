<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Antigravity Remote</title>
  <meta name="description" content="Local-First mobile web companion for Antigravity IDE" />
  <meta name="theme-color" content="#090d16" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Top Header Navigation -->
    <header class="top-header">
      <div class="header-brand">
        <img src="/icon.svg" alt="AG" class="brand-logo" />
        <div class="brand-info">
          <h1 class="brand-title">Antigravity</h1>
          <span class="brand-subtitle">Remote Control</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Status Indicator Pill -->
        <div id="statusPill" class="status-pill offline" title="Connection status">
          <span class="status-dot"></span>
          <span id="statusText" class="status-label">Offline</span>
        </div>

        <!-- Effort Level Selector -->
        <button id="effortBtn" class="pill-btn effort-btn" title="Reasoning Effort">
          <span class="effort-tag">Low</span>
        </button>

        <!-- Sound Toggle -->
        <button id="soundToggleBtn" class="icon-btn active" title="Sound Feedback" aria-label="Toggle Sound">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>

        <!-- RTL/LTR Direction Toggle -->
        <button id="dirToggleBtn" class="pill-btn dir-btn" title="Text Direction (RTL / LTR)" aria-label="Toggle Direction">
          <span class="dir-tag">LTR</span>
        </button>

        <!-- Haptics Toggle -->
        <button id="hapticToggleBtn" class="icon-btn active" title="Vibration Feedback" aria-label="Toggle Haptics">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
            <path d="M1 9l2 3-2 3M23 9l-2 3 2 3"></path>
          </svg>
        </button>

        <!-- Clear Chat -->
        <button id="clearBtn" class="icon-btn danger-hover" title="Clear Chat" aria-label="Clear Chat">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Context Info Bar -->
    <div class="context-bar">
      <button id="changeDirBtn" class="cwd-wrapper" title="Click to change workspace folder">
        <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="cwdText" class="cwd-text">~</span>
        <svg class="edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </button>
      <div class="session-mode-wrapper">
        <label class="toggle-checkbox" title="Keep conversation memory">
          <input type="checkbox" id="continueSessionCheckbox" checked />
          <span class="toggle-label">Continue Session</span>
        </label>
      </div>
    </div>

    <!-- Main Chat Feed -->
    <main id="chatFeed" class="chat-feed">
      <!-- Empty State / Welcome Screen -->
      <div id="welcomeCard" class="welcome-card">
        <div class="welcome-orb">
          <img src="/icon.svg" alt="Antigravity" class="welcome-icon" />
        </div>
        <h2 class="welcome-title">Antigravity Mobile Remote</h2>
        <p class="welcome-desc">
          Connected to your desktop agent over low-latency Wi-Fi LAN. Type or speak to direct the assistant in real-time.
        </p>

        <div class="quick-chips">
          <button class="chip" data-prompt="git status && git diff --stat">📊 Git Status</button>
          <button class="chip" data-prompt="What projects or files am I currently working on?">📂 Current Context</button>
          <button class="chip" data-prompt="Check system resources and running background tasks">⚡ System Load</button>
          <button class="chip" data-prompt="Run tests or check if the codebase builds cleanly">🧪 Run Tests</button>
        </div>
      </div>
    </main>

    <!-- Live Agent Thinking / Progress Indicator -->
    <div id="liveBanner" class="live-banner hidden">
      <div class="banner-pulse"></div>
      <span id="liveBannerText" class="banner-text">Agent is thinking...</span>
      <button id="bannerCancelBtn" class="banner-stop-btn">Stop</button>
    </div>

    <!-- Bottom Fixed Input Dock -->
    <footer class="input-dock">
      <div class="input-container">
        <!-- Voice Input Mic Button -->
        <button id="micBtn" class="dock-btn mic-btn" title="Voice Input" aria-label="Voice Input">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Auto-expanding Textarea -->
        <textarea
          id="promptInput"
          class="prompt-textarea"
          rows="1"
          placeholder="Message Antigravity..."
          aria-label="Prompt Input"
        ></textarea>

        <!-- Send / Stop Button -->
        <button id="actionBtn" class="dock-btn send-btn" title="Send Prompt" aria-label="Send">
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <svg class="stop-icon hidden" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
        </button>
      </div>
    </footer>
    <!-- Workspace Directory Modal -->
    <div id="workspaceModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title-group">
            <svg class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <h3>Change Working Directory</h3>
          </div>
          <button id="closeModalBtn" class="modal-close-btn" aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body">
          <p class="modal-desc">Enter the absolute path of the project folder where the agent should work:</p>
          <div class="input-group">
            <input type="text" id="workspaceInput" class="modal-input" placeholder="/home/username/projects/my-app" autocomplete="off" spellcheck="false" />
          </div>
          <div id="workspaceError" class="modal-error hidden"></div>
        </div>
        <div class="modal-footer">
          <button id="cancelModalBtn" class="modal-btn secondary">Cancel</button>
          <button id="saveWorkspaceBtn" class="modal-btn primary">Switch Directory</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
